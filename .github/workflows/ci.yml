name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DynamicWin.sln
      - run: dotnet build DynamicWin.sln --configuration Release --no-restore
      - run: dotnet test DynamicWin.sln --configuration Release --no-build
